<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanastaMan</title>
<style>
  :root { --bg:#14161c; --panel:#1f232c; --card:#272c37; --line:#333a48; --text:#f2f2f2; --muted:#9aa3b2; --accent:#ff8a2a; --good:#3ddc84; --bad:#ff5c5c; --gold:#ffd23f; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px 16px; }
  h1 { margin:4px 0 8px; font-size:24px; }
  .logo { font-weight:900; font-style:italic; letter-spacing:-.5px; white-space:nowrap; }
  .logo .c { color:var(--accent); } .logo .m { color:#fff; }
  .logo::before { content:"🏀"; font-style:normal; margin-right:6px; }
  #wrap { position:relative; width:100%; max-width:960px; }
  canvas { width:100%; aspect-ratio:16/9; display:block; border-radius:12px; background:#222; touch-action:manipulation; cursor:pointer; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,12,16,.82); border-radius:12px; overflow:auto; padding:16px; }
  #overlay.hidden { display:none; }
  .card { background:var(--panel); border-radius:12px; padding:18px; width:100%; max-width:820px; margin:auto 0; }
  .card h2 { margin:0 0 6px; }
  h2.logo { font-size:28px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:10px 0 14px; }
  .stat { background:var(--card); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:12px; }
  .shop { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; }
  .up { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--text); text-align:left; cursor:pointer; font:inherit; }
  .up:hover:not(:disabled) { border-color:var(--accent); }
  .up:disabled { opacity:.45; cursor:not-allowed; }
  .up .t { font-weight:700; display:flex; justify-content:space-between; }
  .up .d { color:var(--muted); font-size:12px; margin:4px 0; min-height:30px; }
  .up .c { color:var(--gold); font-weight:700; font-size:14px; }
  .row { display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .btn { background:var(--accent); color:#1a1a1a; border:0; border-radius:8px; padding:12px 20px; font-weight:800; font-size:16px; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid #3a4150; font-size:12px; padding:8px 12px; font-weight:600; }
  .money { font-size:18px; color:var(--gold); font-weight:800; }
  p.help { color:var(--muted); font-size:13px; margin:6px 0 0; }
  .foot { color:var(--muted); font-size:13px; } .foot a { color:var(--muted); }
  .career { display:flex; gap:12px; align-items:center; background:var(--card); border-radius:10px; padding:10px 12px; margin:10px 0 0; }
  .shirt { flex:none; width:52px; height:58px; border-radius:8px 8px 6px 6px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; }
  .career b { display:block; font-size:16px; }
  .career span { color:var(--muted); font-size:13px; }
  .bar { height:6px; background:#1b1f28; border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--good); }
  .field { display:flex; flex-direction:column; gap:6px; margin:12px 0; font-weight:700; font-size:14px; }
  .field input { font:inherit; font-size:18px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); user-select:text; -webkit-user-select:text; }
  .swatches { display:flex; gap:10px; }
  .swatches button { width:40px; height:40px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .swatches button.on { border-color:var(--accent); }
  .offer { text-align:center; padding:8px 0; }
  .offer .emoji { font-size:52px; }
  .offer p { font-size:17px; line-height:1.5; max-width:520px; margin:10px auto 18px; }
  .offer .row { justify-content:center; }
  html, body { touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  #rotate { display:none; color:var(--gold); font-size:13px; margin:8px 0 0; text-align:center; }
  footer { margin-top:auto; padding-top:16px; font-size:13px; color:var(--muted); text-align:center; }
  /* Móvil: la tienda va debajo del juego en vez de encima, para que tenga espacio */
  @media (max-width:700px) {
    body { padding:8px 12px; }
    h1 { font-size:20px; margin:0 0 6px; }
    #overlay { position:static; background:none; padding:10px 0 0; border-radius:0; overflow:visible; }
    .card { padding:14px; }
    .shop { grid-template-columns:1fr 1fr; }
    .up { padding:8px; }
    .up .d { font-size:11px; min-height:0; }
    .stats { grid-template-columns:repeat(4,1fr); }
    .stat b { font-size:16px; } .stat span { font-size:10px; }
    #go { width:100%; }
  }
  @media (max-width:700px) and (orientation:portrait) { #rotate { display:block; } }
  @media (max-height:500px) and (orientation:landscape) {
    h1, p.help { display:none; }
    body { padding:4px 12px; }
    #wrap { max-width:calc((100vh - 8px) * 16 / 9); }
  }
</style>
</head>
<body>
<h1 class="logo"><span class="c">Canasta</span><span class="m">Man</span></h1>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<p id="rotate">📱 Gira el móvil en horizontal para jugar más cómodo</p>
<p class="help">Clic, toque o <b>Espacio</b> para lanzar cuando la flecha esté en la zona verde. Centro exacto = tiro limpio (+50%). Mete todos los balones del carro y se recarga al instante.</p>
<footer>Hecho con ❤️ por Gonzalo Dario Riveros Plaza</footer>

<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const W = 960, H = 540, FLOOR = 470, HOOP = { x: 862, y: 230 };

// ---------- Mejoras (todo el balance está aquí) ----------
const DAY_BASE = 30, DAY_STEP = 5;                         // el día dura 30 s (+5 s por mejora)
const UPS = [
  { id:'aim',    name:'Puntería',       base:8,   g:1.9, max:10, desc:l=>`Zona verde más grande (+${l*12}%)` },
  { id:'dist',   name:'Distancia',      base:12,  g:3.4, max:5,  desc:l=>`Tiras desde más lejos: ${DIST[l].label}, ${DIST[l].pts} pts por canasta` },
  { id:'rack',   name:'Más balones',    base:6,   g:1.75,max:6,  desc:l=>`${6+l} balones por carro` },
  { id:'reload', name:'Recarga rápida', base:8,   g:1.8, max:10, desc:l=>`Recargar tarda ${reloadTime(l).toFixed(2)} s` },
  { id:'mult',   name:'Puntos x2',      base:50,  g:4.5, max:8,  desc:l=>`Multiplicador de canasta x${2**l}` },
  { id:'multi',  name:'Doble tiro',     base:80,  g:6,   max:3,  desc:l=>`Lanzas ${1+l} balones a la vez` },
  { id:'luck',   name:'Suerte',         base:15,  g:2.1, max:10, desc:l=>`${luckChance(l)}% de balón dorado (x5)` },
  { id:'mate',   name:'Compañero',      base:100, g:2.4, max:10, desc:l=>`Tira solo cada ${mateEvery(l).toFixed(1)} s (${Math.round(mateAcc(l)*100)}% acierto)` },
  { id:'time',   name:'Día más largo',  base:30,  g:2.6, max:4,  desc:l=>`El día dura ${DAY_BASE + l * DAY_STEP} s` },
];
const DIST = [
  { label:'tiro libre',   x:700, pts:1 },
  { label:'media',        x:600, pts:2 },
  { label:'triple',       x:490, pts:4 },
  { label:'triple largo', x:380, pts:7 },
  { label:'medio campo',  x:250, pts:12 },
  { label:'campo entero', x:120, pts:20 },
];
const reloadTime = l => 2.2 * Math.pow(0.84, l);
const luckChance = l => l ? 3 + l * 3 : 0;
const mateEvery  = l => Math.max(0.6, 3.6 - l * 0.3);
const mateAcc    = l => Math.min(0.9, 0.5 + l * 0.04);
const cost = (u, l) => Math.ceil(u.base * Math.pow(u.g, l));

// ---------- Carrera: cada liga tiene su camiseta, su cancha y su objetivo ----------
// goal = puntos que hay que hacer en un solo día para que te vea un cazatalentos de la siguiente liga
const STAGES = [
  { name:'Cancha del barrio',  team:'Barrio',   jersey:'#ff8a2a', num:'#fff',    sky:['#2b3350', '#c0697a'], floor:'#4a4f5c', lines:'#6a7080', gym:false, mult:1,   goal:25 },
  { name:'Liga de Secundaria', team:'Halcones', jersey:'#2e9d5b', num:'#fff',    sky:['#d9cdb4', '#efe6d2'], floor:'#c08a55', lines:'#a8743f', gym:true,  mult:3,   goal:400,
    offer:'Un cazatalentos de la <b>Liga de Secundaria</b> te estaba viendo jugar. Quiere que te unas a los <b>Halcones</b>.' },
  { name:'Liga Universitaria', team:'Toros',    jersey:'#c8323c', num:'#fff',    sky:['#2a2f45', '#4a5070'], floor:'#b47a48', lines:'#9a6538', gym:true,  mult:10,  goal:6000,
    offer:'Un ojeador de la universidad vio tus partidos. Te ofrecen una <b>beca</b> para jugar con los <b>Toros</b>.' },
  { name:'Liga Profesional',   team:'Titanes',  jersey:'#6b3fc9', num:'#fff',    sky:['#120c28', '#3a1e60'], floor:'#a8703f', lines:'#8e5c32', gym:true,  mult:30,  goal:120000,
    offer:'¡Te llegó una oferta profesional! Los <b>Titanes</b> quieren ficharte.' },
  { name:'Liga de Leyendas',   team:'Leyendas', jersey:'#1b1b1b', num:'#c9a227', sky:['#05050c', '#2a2040'], floor:'#2c2c34', lines:'#c9a227', gym:true,  mult:100, goal:null,
    offer:'Eres la estrella de la liga. Te llaman para jugar con las <b>Leyendas</b>, lo más alto del baloncesto.' },
];
const SKINS = ['#f1c9a5', '#d9a47c', '#b07850', '#7a4e30', '#4e3020'];
const stage = () => STAGES[S.stage];

// ---------- Guardado ----------
const FRESH = () => ({ points:0, day:1, total:0, stage:0, best:0, char:null, lv:Object.fromEntries(UPS.map(u=>[u.id,0])) });
let S = FRESH();
try { const raw = localStorage.getItem('canastaman2d-save'); if (raw) { S = Object.assign(FRESH(), JSON.parse(raw)); S.lv = Object.assign(FRESH().lv, S.lv); } } catch(e) {}
const save = () => { try { localStorage.setItem('canastaman2d-save', JSON.stringify(S)); } catch(e) {} };

function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
}

// ---------- Sonido ----------
let AC = null;
function beep(f, d = 0.08, type = 'square', v = 0.05) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch(e) {}
}

// ---------- Estado del día ----------
let R = null, mode = 'menu';
const balls = [], fx = [], texts = [];
let shake = 0;

function startDay() {
  const L = S.lv;
  R = { t: DAY_BASE + L.time * DAY_STEP, balls: 6 + L.rack, reloading: 0, shots: 0, makes: 0, perfects: 0, golds: 0,
        rackMade: 0, rackShot: 0, perfectRacks: 0, earned: 0, mateEarned: 0, m: 0, dir: 1, mateT: 0, best: 0, streak: 0 };
  balls.length = fx.length = texts.length = 0;
  mode = 'play'; hideOverlay();
}

function perBasket() { return DIST[S.lv.dist].pts * 2 ** S.lv.mult * stage().mult; }
function zoneHalf() { return Math.max(0.05, (0.15 - S.lv.dist * 0.012) * (1 + S.lv.aim * 0.12)); }
const playerX = () => DIST[S.lv.dist].x;

function shoot() {
  if (mode !== 'play' || R.t <= 0 || R.reloading > 0 || R.balls <= 0) return;
  const off = Math.abs(R.m - 0.5), z = zoneHalf();
  const made = off < z, perfect = off < z * 0.3;
  const n = 1 + S.lv.multi;
  R.balls--; R.shots += n; R.rackShot++;
  if (made) { R.rackMade++; R.streak++; R.best = Math.max(R.best, R.streak); } else R.streak = 0;
  for (let i = 0; i < n; i++) {
    const gold = Math.random() * 100 < luckChance(S.lv.luck);
    launch(playerX() + 20, FLOOR - 95, made, { perfect, gold, delay: i * 0.12, mate: false });
  }
  beep(220, 0.05, 'triangle');
  if (R.balls === 0) {
    if (R.rackMade === R.rackShot && made) {
      R.perfectRacks++;
      R.balls = 6 + S.lv.rack;
      addText(playerX(), FLOOR - 180, '¡CARRO PERFECTO! recarga gratis', '#3ddc84', 26);
      beep(880, 0.15, 'square'); setTimeout(() => beep(1175, 0.2, 'square'), 90);
    } else R.reloading = reloadTime(S.lv.reload);
    R.rackMade = R.rackShot = 0;
  }
}

function launch(x0, y0, made, o) {
  const tx = made ? HOOP.x : HOOP.x + (Math.random() < .5 ? -30 : 30);
  const dur = 0.55 + (HOOP.x - x0) / 1400;
  balls.push({ x0, y0, tx, ty: HOOP.y - 6, t: -o.delay, dur, made, phase: 'air', x: x0, y: y0,
               arc: 120 + (HOOP.x - x0) * 0.35, ...o });
}

function scoreBall(b) {
  let pts = perBasket();
  if (b.mate) pts = Math.max(1, Math.floor(pts * 0.5));
  if (b.perfect) pts = Math.floor(pts * 1.5);
  if (b.gold) pts *= 5;
  const before = R.earned;
  S.points += pts; S.total += pts; R.earned += pts;
  if (b.mate) R.mateEarned += pts;
  R.makes++; if (b.perfect && !b.mate) R.perfects++; if (b.gold) R.golds++;
  const col = b.gold ? '#ffd23f' : b.perfect ? '#3ddc84' : '#fff';
  addText(HOOP.x - 10, HOOP.y - 40, '+' + fmt(pts) + (b.perfect ? ' ¡limpia!' : ''), col, b.gold ? 30 : 22);
  burst(HOOP.x, HOOP.y + 10, b.gold ? '#ffd23f' : '#ff8a2a', b.gold ? 26 : 12);
  shake = Math.max(shake, b.gold ? 10 : 4);
  beep(b.gold ? 990 : 660, 0.07, 'square'); setTimeout(() => beep(b.gold ? 1320 : 880, 0.09, 'square'), 60);
  const goal = stage().goal;
  if (goal && before < goal && R.earned >= goal) {
    addText(W / 2, 150, '👀 ¡Un cazatalentos te está mirando!', '#3ddc84', 28);
    beep(523, 0.1); setTimeout(() => beep(784, 0.15), 110);
  }
}

function addText(x, y, s, c, size = 22) { texts.push({ x, y, s, c, size, life: 1.4 }); }
function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * 300, vy: -Math.random() * 260, c, life: .7 });
}

// ---------- Bucle ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}

function update(dt) {
  if (mode === 'play') {
    R.t -= dt;
    R.m += R.dir * dt * 1.25;
    if (R.m > 1) { R.m = 1; R.dir = -1; } if (R.m < 0) { R.m = 0; R.dir = 1; }
    if (R.reloading > 0) { R.reloading -= dt; if (R.reloading <= 0) { R.reloading = 0; R.balls = 6 + S.lv.rack; beep(440, .05); } }
    if (S.lv.mate && R.t > 0) {
      R.mateT += dt;
      if (R.mateT >= mateEvery(S.lv.mate)) {
        R.mateT = 0; R.shots++;
        launch(800, FLOOR - 110, Math.random() < mateAcc(S.lv.mate), { mate: true, gold: Math.random() * 100 < luckChance(S.lv.luck), delay: 0, perfect: false });
      }
    }
    if (R.t <= 0 && !balls.some(b => b.phase === 'air')) endDay();
  }
  for (const b of balls) {
    b.t += dt;
    if (b.t < 0) continue;
    if (b.phase === 'air') {
      const p = Math.min(1, b.t / b.dur);
      b.x = b.x0 + (b.tx - b.x0) * p;
      b.y = b.y0 + (b.ty - b.y0) * p - b.arc * 4 * p * (1 - p);
      if (p >= 1) {
        b.phase = 'fall';
        if (b.made) { b.vx = 0; b.vy = 140; if (mode === 'play') scoreBall(b); }
        else { b.vx = (b.tx < HOOP.x ? -1 : 1) * (120 + Math.random() * 120); b.vy = -220; beep(120, .06, 'sawtooth', .03); if (!b.mate && mode === 'play') addText(b.tx, HOOP.y - 30, 'fallo', '#ff5c5c', 16); }
      }
    } else {
      b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > FLOOR - 14) { b.y = FLOOR - 14; b.vy *= -0.5; b.vx *= 0.8; }
      b.life = (b.life ?? 1.4) - dt;
    }
  }
  for (let i = balls.length - 1; i >= 0; i--) if (balls[i].life <= 0) balls.splice(i, 1);
  for (const p of fx) { p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
  for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  shake *= Math.pow(0.002, dt);
}

// ---------- Dibujo ----------
// Edificios del barrio (fijos para que no parpadeen)
const CITY = Array.from({ length: 14 }, (_, i) => ({ x: i * 72 - 10, w: 60 + (i * 37) % 30, h: 90 + (i * 53) % 150,
  win: Array.from({ length: 40 }, () => Math.random() < 0.4) }));

function background(st) {
  const sky = cx.createLinearGradient(0, 0, 0, FLOOR);
  sky.addColorStop(0, st.sky[0]); sky.addColorStop(1, st.sky[1]);
  cx.fillStyle = sky; cx.fillRect(-20, -20, W + 40, FLOOR + 20);
  if (!st.gym) {                                            // barrio: edificios con ventanas y valla
    for (const b of CITY) {
      cx.fillStyle = '#241f38'; cx.fillRect(b.x, FLOOR - 40 - b.h, b.w, b.h + 40);
      let k = 0;
      for (let y = FLOOR - 30 - b.h; y < FLOOR - 50; y += 22) for (let x = b.x + 8; x < b.x + b.w - 10; x += 16)
        if (b.win[k++ % 40]) { cx.fillStyle = '#ffcf7a'; cx.fillRect(x, y, 7, 9); }
    }
    cx.strokeStyle = 'rgba(200,210,225,.25)'; cx.lineWidth = 1;
    for (let x = -100; x < W + 100; x += 14) { cx.beginPath(); cx.moveTo(x, FLOOR - 120); cx.lineTo(x + 120, FLOOR); cx.moveTo(x + 120, FLOOR - 120); cx.lineTo(x, FLOOR); cx.stroke(); }
  } else {                                                  // gimnasio: gradas, pancarta del equipo y focos
    cx.fillStyle = 'rgba(0,0,0,.18)';
    for (let r = 0; r < 4; r++) cx.fillRect(0, FLOOR - 70 - r * 28, W, 14);
    for (let i = 0; i < 70; i++) {                          // público
      const x = (i * 97) % W, y = FLOOR - 78 - ((i * 31) % 4) * 28;
      cx.fillStyle = ['#e2b07a', '#8a5a3a', '#f0d0b0', '#5a3a28'][i % 4]; cx.beginPath(); cx.arc(x, y, 6, 0, 7); cx.fill();
      cx.fillStyle = i % 3 ? st.jersey : '#ddd'; cx.fillRect(x - 7, y + 6, 14, 10);
    }
    cx.fillStyle = st.jersey; cx.fillRect(W / 2 - 170, 40, 340, 56);
    cx.fillStyle = st.num; cx.font = '900 34px system-ui'; cx.textAlign = 'center';
    cx.fillText(st.team.toUpperCase(), W / 2, 81);
    for (const x of [120, 360, 600, 840]) {
      const g = cx.createRadialGradient(x, 10, 2, x, 10, 70); g.addColorStop(0, 'rgba(255,255,230,.8)'); g.addColorStop(1, 'rgba(255,255,230,0)');
      cx.fillStyle = g; cx.fillRect(x - 70, 0, 140, 80);
    }
  }
  cx.fillStyle = st.floor; cx.fillRect(-20, FLOOR, W + 40, H - FLOOR + 20);
  cx.fillStyle = st.lines; for (let x = 0; x < W; x += 60) cx.fillRect(x, FLOOR, 2, H - FLOOR);
}

function draw() {
  const st = stage();
  cx.save();
  if (shake > .3) cx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  background(st);
  // marcas de distancia
  cx.font = '11px system-ui'; cx.textAlign = 'center';
  DIST.forEach((d, i) => {
    cx.fillStyle = i <= S.lv.dist ? 'rgba(255,255,255,.65)' : 'rgba(255,255,255,.2)';
    cx.fillRect(d.x + 20, FLOOR, 3, 12); cx.fillText(d.label, d.x + 20, FLOOR + 26);
  });
  // canasta
  cx.fillStyle = '#666'; cx.fillRect(918, HOOP.y - 30, 8, FLOOR - HOOP.y + 30);
  cx.fillStyle = '#eee'; cx.fillRect(900, HOOP.y - 95, 12, 110);
  cx.strokeStyle = '#d33'; cx.lineWidth = 2; cx.strokeRect(902, HOOP.y - 45, 8, 40);
  cx.strokeStyle = 'rgba(255,255,255,.7)'; cx.lineWidth = 1.5;
  for (let i = 0; i <= 4; i++) { cx.beginPath(); cx.moveTo(HOOP.x - 26 + i * 13, HOOP.y); cx.lineTo(HOOP.x - 16 + i * 8, HOOP.y + 38); cx.stroke(); }
  const c = S.char || { name: '', num: 7, skin: SKINS[1] };
  // compañero (mismo equipo)
  if (S.lv.mate) person(790, st, c.num === 23 ? 11 : 23, SKINS[3], 0.85, '');
  // jugador
  person(playerX(), st, c.num, c.skin, 1, mode === 'play' ? c.name : '');
  // balones
  for (const b of balls) if (b.t >= 0 && !(b.phase === 'fall' && b.made && b.y < HOOP.y + 2)) ball(b.x, b.y, b.gold);
  cx.strokeStyle = '#e8572a'; cx.lineWidth = 5; cx.beginPath(); cx.moveTo(HOOP.x - 30, HOOP.y); cx.lineTo(HOOP.x + 34, HOOP.y); cx.stroke();
  for (const b of balls) if (b.t >= 0 && b.phase === 'fall' && b.made && b.y < HOOP.y + 2) ball(b.x, b.y, b.gold);
  for (const p of fx) { cx.globalAlpha = Math.max(0, p.life / .7); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, 5, 5); }
  cx.globalAlpha = 1;
  if (mode === 'play') { meter(); hud(); }
  for (const t of texts) {
    cx.globalAlpha = Math.max(0, Math.min(1, t.life)); cx.fillStyle = t.c; cx.font = `800 ${t.size}px system-ui`;
    cx.textAlign = 'center'; cx.strokeStyle = 'rgba(0,0,0,.6)'; cx.lineWidth = 4; cx.strokeText(t.s, t.x, t.y); cx.fillText(t.s, t.x, t.y);
  }
  cx.globalAlpha = 1; cx.restore();
}

function person(x, st, num, skin, s, name) {
  const y = FLOOR;
  cx.fillStyle = '#222'; cx.fillRect(x - 10 * s, y - 40 * s, 8 * s, 40 * s); cx.fillRect(x + 2 * s, y - 40 * s, 8 * s, 40 * s);
  cx.fillStyle = '#eee'; cx.fillRect(x - 12 * s, y - 5 * s, 11 * s, 5 * s); cx.fillRect(x + 1 * s, y - 5 * s, 11 * s, 5 * s);
  cx.fillStyle = st.jersey; cx.fillRect(x - 14 * s, y - 85 * s, 28 * s, 46 * s);
  cx.fillStyle = st.num; cx.font = `900 ${18 * s}px system-ui`; cx.textAlign = 'center'; cx.fillText(num, x, y - 55 * s);
  cx.fillStyle = skin; cx.beginPath(); cx.arc(x, y - 98 * s, 13 * s, 0, 7); cx.fill();
  cx.fillStyle = '#23262e'; cx.fillRect(x - 13 * s, y - 112 * s, 26 * s, 7 * s);
  cx.strokeStyle = skin; cx.lineWidth = 6 * s; cx.beginPath(); cx.moveTo(x + 10 * s, y - 80 * s); cx.lineTo(x + 22 * s, y - 104 * s); cx.stroke();
  if (name) { cx.fillStyle = 'rgba(255,255,255,.85)'; cx.font = '700 12px system-ui'; cx.fillText(name, x, y - 120 * s); }
}

function ball(x, y, gold) {
  cx.fillStyle = gold ? '#ffd23f' : '#f07a22'; cx.beginPath(); cx.arc(x, y, 12, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(0,0,0,.45)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.arc(x, y, 12, 0, 7); cx.moveTo(x - 12, y); cx.lineTo(x + 12, y); cx.moveTo(x, y - 12); cx.lineTo(x, y + 12); cx.stroke();
}

function meter() {
  const x = playerX() - 60, top = FLOOR - 190, h = 170, z = zoneHalf();
  cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(x, top, 18, h);
  cx.fillStyle = '#3ddc84'; cx.fillRect(x, top + h * (0.5 - z), 18, h * z * 2);
  cx.fillStyle = '#b6ffd5'; cx.fillRect(x, top + h * (0.5 - z * .3), 18, h * z * .6);
  const my = top + h * R.m;
  cx.fillStyle = R.reloading > 0 || R.balls === 0 ? '#777' : '#fff';
  cx.beginPath(); cx.moveTo(x + 22, my); cx.lineTo(x + 34, my - 7); cx.lineTo(x + 34, my + 7); cx.fill();
  cx.fillRect(x - 2, my - 1.5, 22, 3);
}

function txt(s, x, y, font, col, align = 'left') {
  cx.font = font; cx.textAlign = align; cx.strokeStyle = 'rgba(0,0,0,.55)'; cx.lineWidth = 4;
  cx.strokeText(s, x, y); cx.fillStyle = col; cx.fillText(s, x, y);
}

function hud() {
  const st = stage();
  txt(`Día ${S.day} · ${st.team}`, 18, 34, '800 22px system-ui', '#fff');
  txt(`⏱ ${Math.max(0, R.t).toFixed(1)} s`, 18, 64, '800 22px system-ui', R.t < 10 ? '#ff5c5c' : '#fff');
  txt(`${fmt(S.points)} pts`, W - 18, 34, '800 22px system-ui', '#ffd23f', 'right');
  txt(`${fmt(perBasket())} por canasta`, W - 18, 56, '600 14px system-ui', '#eee', 'right');
  if (st.goal) txt(R.earned >= st.goal ? '👀 ¡Cazatalentos mirando!' : `🎯 Hoy: ${fmt(R.earned)} / ${fmt(st.goal)} pts`, W - 18, 80, '700 15px system-ui', R.earned >= st.goal ? '#3ddc84' : '#fff', 'right');
  // logo
  cx.font = 'italic 900 22px system-ui'; cx.textAlign = 'left';
  const w1 = cx.measureText('Canasta').width, w2 = cx.measureText('Man').width, lx = W / 2 - (w1 + w2) / 2;
  txt('Canasta', lx, 34, 'italic 900 22px system-ui', '#ff8a2a'); txt('Man', lx + w1, 34, 'italic 900 22px system-ui', '#fff');
  // carro de balones
  const n = 6 + S.lv.rack;
  for (let i = 0; i < n; i++) {
    cx.globalAlpha = i < R.balls ? 1 : .2;
    cx.fillStyle = '#f07a22'; cx.beginPath(); cx.arc(30 + i * 22, 96, 8, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
  if (R.reloading > 0) {
    const p = 1 - R.reloading / reloadTime(S.lv.reload);
    cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(20, 112, 160, 8); cx.fillStyle = '#4aa3ff'; cx.fillRect(20, 112, 160 * p, 8);
    txt('recargando…', 20, 136, '600 12px system-ui', '#9cc9ff');
  }
  if (R.streak >= 3) txt(`🔥 Racha x${R.streak}`, 20, 160, '800 16px system-ui', '#3ddc84');
}

// ---------- Pantallas ----------
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
const LOGO = '<h2 class="logo"><span class="c">Canasta</span><span class="m">Man</span></h2>';
function hideOverlay() { overlay.classList.add('hidden'); }
const shirtHtml = (st, num) => `<div class="shirt" style="background:${st.jersey};color:${st.num}">${num}</div>`;
let lastStats = null;

function endDay() {
  mode = 'end';
  const pct = R.shots ? Math.round(R.makes / R.shots * 100) : 0;
  lastStats = { title: `Fin del día ${S.day}`, items: [
    ['Puntos ganados', fmt(R.earned)], ['Canastas', `${R.makes} / ${R.shots}`], ['Acierto', pct + '%'],
    ['Tiros limpios', R.perfects], ['Mejor racha', R.best], ['Carros perfectos', R.perfectRacks],
    ['Balones dorados', R.golds], ['Del compañero', fmt(R.mateEarned)] ] };
  S.day++; S.best = Math.max(S.best, R.earned); save();
  const goal = stage().goal;
  if (goal && R.earned >= goal) renderOffer(); else renderShop();
}

// Crear personaje (primera vez o al borrar la partida)
function renderCreate() {
  mode = 'create';
  const c = S.char || { name: '', num: 7, skin: SKINS[1] };
  card.innerHTML = `${LOGO}
    <p class="help">Empiezas desde cero en la cancha del barrio. Haz puntos, mejora y que te vean los cazatalentos: secundaria, universidad, profesional… hasta las Leyendas.</p>
    <label class="field">Nombre<input id="cName" maxlength="12" placeholder="Tu nombre" value="${c.name}" autocomplete="off"></label>
    <label class="field">Número de camiseta<input id="cNum" type="number" min="0" max="99" inputmode="numeric" value="${c.num}"></label>
    <div class="field">Tono de piel<div class="swatches">${SKINS.map(s => `<button type="button" data-skin="${s}" class="${s === c.skin ? 'on' : ''}" style="background:${s}" aria-label="Tono de piel"></button>`).join('')}</div></div>
    <div class="row"><span></span><button class="btn" id="cGo">Empezar carrera ▶</button></div>`;
  let skin = c.skin;
  const preview = () => { S.char = { name: document.getElementById('cName').value.replace(/[<>&"]/g, '').trim() || 'Jugador', num: Math.max(0, Math.min(99, parseInt(document.getElementById('cNum').value) || 0)), skin }; };
  card.querySelectorAll('[data-skin]').forEach(b => b.onclick = () => {
    skin = b.dataset.skin; card.querySelectorAll('[data-skin]').forEach(x => x.classList.toggle('on', x === b)); preview();
  });
  document.getElementById('cName').oninput = preview; document.getElementById('cNum').oninput = preview;
  document.getElementById('cGo').onclick = () => { preview(); save(); beep(660, 0.08); renderShop(); };
  overlay.classList.remove('hidden');
}

// Oferta del cazatalentos al cumplir el objetivo del día
function renderOffer() {
  mode = 'offer';
  const next = STAGES[S.stage + 1];
  card.innerHTML = `<div class="offer">
    <div class="emoji">📋</div>
    <h2>¡Te estaban viendo!</h2>
    <p>${next.offer}</p>
    <div class="row" style="justify-content:center;gap:14px;margin:0 0 18px">${shirtHtml(stage(), S.char.num)} <span style="font-size:24px">→</span> ${shirtHtml(next, S.char.num)}</div>
    <p style="font-size:14px;color:var(--muted);margin-top:0">Nueva camiseta, nueva cancha y cada canasta vale x${next.mult}. Tus mejoras se quedan.</p>
    <div class="row"><button class="btn ghost" id="no">Rechazar</button><button class="btn" id="yes">¡Acepto! ✍️</button></div>
  </div>`;
  beep(523, 0.1); setTimeout(() => beep(659, 0.1), 110); setTimeout(() => beep(784, 0.18), 220);
  document.getElementById('yes').onclick = () => {
    S.stage++; S.best = 0; save();
    lastStats = { title: `¡Ya juegas con los ${stage().team}!`, items: lastStats.items };
    beep(784, 0.1); setTimeout(() => beep(1047, 0.25), 120);
    renderShop();
  };
  document.getElementById('no').onclick = () => renderShop();
  overlay.classList.remove('hidden');
}

function renderShop() {
  mode = 'shop';
  const st = stage();
  const items = UPS.map(u => {
    const l = S.lv[u.id], maxed = l >= u.max, c = cost(u, l);
    return `<button class="up" data-id="${u.id}" ${maxed || S.points < c ? 'disabled' : ''}>
      <div class="t"><span>${u.name}</span><span style="color:var(--muted)">Nv ${l}/${u.max}</span></div>
      <div class="d">${maxed ? u.desc(l) : 'Siguiente: ' + u.desc(l + 1)}</div>
      <div class="c">${maxed ? 'MÁXIMO' : fmt(c) + ' pts'}</div></button>`;
  }).join('');
  card.innerHTML = `
    ${lastStats ? `<h2>${lastStats.title}</h2><div class="stats">${lastStats.items.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div>`
      : `${LOGO}<p class="help">Tienes ${DAY_BASE + S.lv.time * DAY_STEP} segundos al día para encestar. Gana puntos, compra mejoras y vuelve más fuerte mañana.</p>`}
    <div class="career">${shirtHtml(st, S.char.num)}<div style="flex:1;min-width:0">
      <b>${S.char.name} · ${st.team}</b>
      <span>${st.name}${st.goal ? ` · Objetivo: haz <b style="display:inline;font-size:13px;color:var(--text)">${fmt(st.goal)} pts en un día</b> para que te vea un cazatalentos (récord: ${fmt(S.best)})` : ' · Has llegado a lo más alto'}</span>
      ${st.goal ? `<div class="bar"><i style="width:${Math.min(100, S.best / st.goal * 100)}%"></i></div>` : ''}
    </div></div>
    <div class="row" style="margin:12px 0 10px"><span class="money">💰 ${fmt(S.points)} pts</span><button class="btn" id="go">Empezar día ${S.day} ▶</button></div>
    <div class="shop">${items}</div>
    <div class="row foot"><span>Total histórico: ${fmt(S.total)} · <a href="3d.html">versión 3D</a></span><button class="btn ghost" id="reset">Borrar partida</button></div>`;
  card.querySelectorAll('.up').forEach(b => b.onclick = () => {
    const u = UPS.find(x => x.id === b.dataset.id), c = cost(u, S.lv[u.id]);
    if (S.points >= c && S.lv[u.id] < u.max) { S.points -= c; S.lv[u.id]++; save(); beep(760, .08); renderShop(); }
  });
  document.getElementById('go').onclick = startDay;
  const rb = document.getElementById('reset');
  rb.onclick = () => {
    if (!rb.dataset.armed) { rb.dataset.armed = 1; rb.textContent = '¿Seguro? Pulsa otra vez'; return; }
    S = FRESH(); lastStats = null; save(); renderCreate();
  };
  overlay.classList.remove('hidden');
}

// Durante el día, tocar en cualquier parte de la pantalla lanza (en móvil el canvas es pequeño)
addEventListener('pointerdown', e => { if (mode === 'play') { e.preventDefault(); shoot(); } });
addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.target.tagName === 'INPUT' || mode === 'create' || mode === 'offer') return;
  e.preventDefault(); if (mode === 'play') shoot(); else if (!e.repeat) startDay();
});

if (S.char) renderShop(); else renderCreate();
requestAnimationFrame(loop);
window.__game = { get R() { return R; }, get S() { return S; }, startDay };
</script>
</body>
</html>
